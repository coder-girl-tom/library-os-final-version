{% extends "base.html" %}{% block title %}Add Book{% endblock %}{% block page_title %}Add Book{% endblock %}
{% block content %}
<div class="card" style="max-width:680px">
  <div class="card-header">Add New Book</div>
  <div class="card-body p-4">
    <form method="POST">
      <div class="row g-3">
        <div class="col-12"><label class="form-label fw-semibold">Title *</label><input type="text" name="title" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Author *</label><input type="text" name="author" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Accession Number</label><input type="text" name="accession_number" class="form-control"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">ISBN</label><input type="text" name="isbn" class="form-control"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Publisher</label><input type="text" name="publisher" class="form-control"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Category</label><input type="text" name="category" class="form-control" list="cats"><datalist id="cats"><option value="Fiction"><option value="Non-Fiction"><option value="Science"><option value="History"><option value="Mathematics"><option value="Literature"><option value="Reference"></datalist></div>
        <div class="col-md-3"><label class="form-label fw-semibold">Publication Year</label><input type="number" name="publication_year" class="form-control" min="1000" max="2099"></div>
        <div class="col-md-3"><label class="form-label fw-semibold">Quantity *</label><input type="number" name="quantity" class="form-control" value="1" min="1" required></div>
        <div class="col-md-4"><label class="form-label fw-semibold">Purchase Price</label><input type="number" step="0.01" name="purchase_price" class="form-control"></div>
        <div class="col-md-5"><label class="form-label fw-semibold">Shelf Location</label><input type="text" name="shelf_location" class="form-control"></div>
        <div class="col-12"><label class="form-label fw-semibold">Description</label><textarea name="description" class="form-control" rows="3"></textarea></div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Add Book</button>
        <a href="{{ url_for('books_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
