{% extends "base.html" %}{% block title %}Add Student{% endblock %}{% block page_title %}Add Student{% endblock %}
{% block content %}
<div class="card" style="max-width:680px">
  <div class="card-header"> Add New Student</div>
  <div class="card-body p-4">
    <form method="POST">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label fw-semibold">Full Name *</label><input type="text" name="full_name" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Student ID *</label><input type="text" name="student_id" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label fw-semibold">Class</label><input type="text" name="class_name" class="form-control" placeholder="e.g. 10th"></div>
        <div class="col-md-2"><label class="form-label fw-semibold">Section</label><input type="text" name="section" class="form-control" placeholder="A"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Email</label><input type="email" name="email" class="form-control"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input type="text" name="phone" class="form-control"></div>
        <div class="col-12"><label class="form-label fw-semibold">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div>
      </div>
      <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Add Student</button>
        <a href="{{ url_for('students_list') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
