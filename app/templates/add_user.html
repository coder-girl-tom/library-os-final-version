{% extends "base.html" %}{% block title %}Add User{% endblock %}{% block page_title %}Add User{% endblock %}
{% block content %}
<div class="card" style="max-width:500px">
  <div class="card-header"> Add New Staff User</div>
  <div class="card-body p-4">
    <form method="POST">
      <div class="mb-3"><label class="form-label fw-semibold">Username *</label><input type="text" name="username" class="form-control" required></div>
      <div class="mb-3"><label class="form-label fw-semibold">Full Name</label><input type="text" name="full_name" class="form-control"></div>
      <div class="mb-3"><label class="form-label fw-semibold">Role</label>
        <select name="role" class="form-select"><option value="LIBRARIAN">Librarian</option><option value="STAFF">Staff</option><option value="ADMIN">Admin</option></select></div>
      <div class="mb-3"><label class="form-label fw-semibold">Password *</label><input type="password" name="password" class="form-control" required></div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Create User</button>
        <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
