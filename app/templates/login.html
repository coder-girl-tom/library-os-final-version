<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - LibrarySystem PRO</title>
<link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}" rel="stylesheet">
<style>
:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--text:#1a1f36;--border:#e5e7eb;--input:#fff}
:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1f2e;--text:#e2e8f0;--border:#2d3748;--input:#1e2433}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:400px}
.form-control{background:var(--input);border-color:var(--border);color:var(--text)}
.form-control:focus{background:var(--input);color:var(--text);border-color:#4f8ef7;box-shadow:0 0 0 3px rgba(79,142,247,0.15)}
</style>
</head>
<body>
<div class="card shadow-lg">
  <div class="text-center mb-4">
    <i class="bi bi-book-half" style="font-size:2.5rem;color:#4f8ef7"></i>
    <h4 class="fw-bold mt-2 mb-0">LibrarySystem PRO</h4>
    <small class="text-muted">Sign in to your account</small>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}{% endif %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3"><label class="form-label small fw-semibold">Username</label>
      <input type="text" name="username" class="form-control" required autofocus></div>
    <div class="mb-3"><label class="form-label small fw-semibold">Password</label>
      <input type="password" name="password" class="form-control" required></div>
    <button type="submit" class="btn btn-primary w-100 fw-semibold">Sign In</button>
  </form>
  <div class="text-center mt-3"><a href="{{ url_for('password_recovery') }}" class="small text-muted">Forgot password?</a></div>
</div>
<script>
const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);
</script>
</body></html>
