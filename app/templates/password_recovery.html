<!DOCTYPE html><html lang="en" data-theme="light">
<head><meta charset="UTF-8"><title>Password Recovery</title>
<link href="{{ url_for('static', filename='vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
<style>:root[data-theme="light"]{--bg:#f4f6fb;--card:#fff;--text:#1a1f36;--border:#e5e7eb;--input:#fff}:root[data-theme="dark"]{--bg:#0f1117;--card:#1a1f2e;--text:#e2e8f0;--border:#2d3748;--input:#1e2433}body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:400px}.form-control{background:var(--input);border-color:var(--border);color:var(--text)}.form-control:focus{background:var(--input);color:var(--text)}</style>
</head>
<body>
<div class="card shadow-lg">
  <h5 class="fw-bold mb-1">🔑 Password Recovery</h5><p class="text-muted small mb-4">Enter your username and recovery answer.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat,msg in messages %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
  <form method="POST">
    <div class="mb-3"><label class="form-label fw-semibold">Username</label><input type="text" name="username" class="form-control" required></div>
    <div class="mb-3"><label class="form-label fw-semibold">Recovery Answer</label><input type="text" name="recovery_answer" class="form-control" required></div>
    <div class="mb-3"><label class="form-label fw-semibold">New Password</label><input type="password" name="new_password" class="form-control" required></div>
    <div class="mb-3"><label class="form-label fw-semibold">Confirm Password</label><input type="password" name="confirm_password" class="form-control" required></div>
    <button type="submit" class="btn btn-primary w-100">Reset Password</button>
  </form>
  <div class="text-center mt-3"><a href="{{ url_for('login') }}" class="small text-muted">← Back to Login</a></div>
</div>
<script>const t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);</script>
</body></html>
